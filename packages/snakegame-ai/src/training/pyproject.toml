[project]
name = "snakegame-ai"
version = "0.1.0"
description = "PPO training for @arkfun/snakegame via a PyMiniRacer headless bridge"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "mini-racer>=0.12",
    "torch>=2.2",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "pytest>=8.0",
    "tensorboard>=2.16",
    "rich>=13.0",
    "tqdm>=4.66",
]

[tool.uv]
package = false
